<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Requests - FoodSaver</title>
  
  <script src="config.js" defer></script>
  <script src="i18n.js" defer></script>

  <script src="request.js" defer></script>

 <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-bg: #0a0a0f;
      --c-surface: #13131a;
      --c-surface-2: #1a1a24;
      --c-border: #2a2a3a;
      --c-text: #f0f0f5;
      --c-muted: #8888a0;
      --c-accent: #22c55e;
      --c-accent-glow: rgba(34,197,94,0.25);
      --c-danger: #ef4444;
      --c-warning: #f59e0b;
      --radius: 14px;
      --radius-sm: 8px;
      --radius-lg: 20px;
      --font: 'Inter', sans-serif;
      --ease: cubic-bezier(0.4,0,0.2,1);
    }

    body {
      font-family: var(--font);
      background: var(--c-bg);
      color: var(--c-text);
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    .container {
      max-width: 840px;
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      gap: 16px;
    }

    .page-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.4px;
      background: linear-gradient(135deg, #f0f0f5, #a0a0b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--c-surface);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s var(--ease);
    }

    .back-btn:hover { border-color: var(--c-accent); color: var(--c-accent); transform: translateY(-1px); }

    .history-list { display: flex; flex-direction: column; gap: 12px; }

    .history-item {
      background: var(--c-surface);
      padding: 20px 24px;
      border: 1px solid var(--c-border);
      border-radius: var(--radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      transition: all 0.25s var(--ease);
    }

    .history-item:hover {
      border-color: rgba(34,197,94,0.3);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .food-info p {
      margin: 5px 0;
      color: var(--c-muted);
      font-size: 14px;
    }

    .food-info p strong {
      color: var(--c-text);
      font-weight: 600;
    }

    .food-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--c-text) !important;
      margin-bottom: 10px !important;
    }

    .empty-text {
      color: var(--c-muted);
      font-size: 15px;
      text-align: center;
      padding: 64px 0;
      background: var(--c-surface);
      border-radius: var(--radius);
      border: 1px solid var(--c-border);
    }

    /* Status Badges */
    .status-badge {
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .status-pending { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .status-approve { background: rgba(34,197,94,0.15); color: #4ade80; }
    .status-decline { background: rgba(239,68,68,0.12); color: #f87171; }

    @media (max-width: 600px) {
      .history-item { flex-direction: column; align-items: flex-start; gap: 14px; }
      .page-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1 class="page-title" data-i18n="myRequestedFood">My Requested Food</h1>
      <button class="back-btn" onclick="window.location.href='customer.html'" data-i18n="backToDashboard">
        &#8592; Back to Dashboard
      </button>
    </div>

    <div id="historyList" class="history-list">
      <p class="empty-text" data-i18n="loadingYourRequests">
        Loading your requests...
      </p>
    </div>
  </div>
</body>
</html>
