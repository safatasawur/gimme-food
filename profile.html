<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="config.js" defer></script>
   <script src="i18n.js" defer></script>

  <script src="profile.js" defer></script>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-bg: #0a0a0f;
      --c-surface: #13131a;
      --c-surface-2: #1a1a24;
      --c-border: #2a2a3a;
      --c-text: #f0f0f5;
      --c-muted: #8888a0;
      --c-accent: #22c55e;
      --c-accent-glow: rgba(34,197,94,0.25);
      --c-danger: #ef4444;
      --radius: 14px;
      --radius-sm: 8px;
      --radius-lg: 20px;
      --font: 'Inter', sans-serif;
      --ease: cubic-bezier(0.4,0,0.2,1);
    }

    body {
      font-family: var(--font);
      background: var(--c-bg);
      color: var(--c-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      min-height: 100vh;
      background: var(--c-bg);
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--c-surface);
      padding: 44px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--c-border);
      animation: cardIn 0.4s var(--ease) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 36px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--c-border);
    }
/* 
    .avatar {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #22c55e, #3b82f6);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      box-shadow: 0 0 40px rgba(34,197,94,0.2);
    } */
     .avatar {
  width: 64px;
  height: 64px;
  background: #0a0a0f;
  border: 2px solid #22c55e;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 0 30px rgba(34,197,94,0.18);
}

.avatar img {
  width: 42px;
  height: 42px;
  object-fit: contain;
}

    h2 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #f0f0f5, #a0a0b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 13.5px;
      color: var(--c-muted);
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .info-row:last-of-type { border-bottom: none; }

    .info-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--c-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      min-width: 100px;
      padding-top: 3px;
    }

    .info-value {
      font-size: 15px;
      color: var(--c-text);
      font-weight: 500;
    }

    #ownerSection {
      margin-top: 12px;
      margin-bottom: 8px;
      padding-top: 20px;
      border-top: 1px solid var(--c-border);
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--c-accent);
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    button {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s var(--ease);
    }

    .btn-back {
      background: var(--c-surface-2);
      color: var(--c-text);
      border: 1px solid var(--c-border);
    }

    .btn-back:hover { border-color: var(--c-accent); color: var(--c-accent); transform: translateY(-1px); }

    .btn-logout {
      background: rgba(239,68,68,0.12);
      color: #f87171;
      border: 1px solid rgba(239,68,68,0.2);
    }

.btn-logout:hover { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.4); transform: translateY(-1px); }
  </style>  
</head>


 <body>
  <div class="page-wrap">
    <div class="container">
      <div class="profile-header">
        <div class="avatar">
  <img src="profile.png" alt="Profile Image">
</div>
        <div>
          <h2 data-i18n="myProfile">My Profile</h2>
          <div class="subtitle">Account information</div>
        </div>
      </div>

      <div class="info-row">
        <div class="info-label" data-i18n="nameLabel">Name</div>
        <div class="info-value" id="name"></div>
      </div>

      <div class="info-row">
        <div class="info-label" data-i18n="emailLabel">Email</div>
        <div class="info-value" id="email"></div>
      </div>

      <div class="info-row">
        <div class="info-label" data-i18n="addressLabel">Address</div>
        <div class="info-value" id="address"></div>
      </div>

      <div class="info-row">
        <div class="info-label" data-i18n="roleLabel">Role</div>
        <div class="info-value" id="role"></div>
      </div>

      <div id="ownerSection" style="display:none;">
        <div class="section-label">Restaurant Details</div>

        <div class="info-row">
          <div class="info-label" data-i18n="restaurantNameLabel">Restaurant</div>
          <div class="info-value" id="restaurantName"></div>
        </div>

        <div class="info-row">
          <div class="info-label" data-i18n="restaurantAddressLabel">Res. Address</div>
          <div class="info-value" id="restaurantAddress"></div>
        </div>

        <div class="info-row">
          <div class="info-label" data-i18n="foodTypeLabel">Food Type</div>
          <div class="info-value" id="foodType"></div>
        </div>
      </div>

      <div class="actions">
        <button class="btn-back" onclick="goBack()" data-i18n="back">Back</button>
        <button class="btn-logout" onclick="logout()" data-i18n="logout">Logout</button>
      </div>
    </div>
  </div>
</body>
</html>
