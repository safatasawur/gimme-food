<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodSaver - Customer Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="config.js" defer></script>
  <script src="i18n.js" defer></script>

  <script src="customer.js" defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-bg: #0a0a0f;
      --c-surface: #13131a;
      --c-surface-2: #1a1a24;
      --c-border: #2a2a3a;
      --c-text: #f0f0f5;
      --c-muted: #8888a0;
      --c-accent: #22c55e;
      --c-accent-glow: rgba(34,197,94,0.25);
      --c-danger: #ef4444;
      --c-warning: #f59e0b;
      --radius: 14px;
      --radius-sm: 8px;
      --radius-lg: 20px;
      --font: 'Inter', sans-serif;
      --ease: cubic-bezier(0.4,0,0.2,1);
    }

    body {
      font-family: var(--font);
      background: var(--c-bg);
      color: var(--c-text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      line-height: 1.6;
    }
    header {
  background: rgba(10,10,15,0.85);
  backdrop-filter: blur(24px);
  padding: 10px 48px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 85px;
  height: auto;
  position: sticky;
  top: 0;
  z-index: 100;
}
/* 
    header {
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(24px);
      padding: 0 48px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    } */

    header a {
      color: var(--c-text);
      text-decoration: none;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .nav-link {
      background: none;
      border: none;
      color: var(--c-muted);
      font-weight: 500;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.2s var(--ease);
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .nav-link:hover { color: var(--c-text); background: rgba(255,255,255,0.05); }

    .nav-btn {
      background: var(--c-surface);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s var(--ease);
      white-space: nowrap;
    }

    .nav-btn:hover { border-color: var(--c-accent); color: var(--c-accent); transform: translateY(-1px); }
    .nav-btn.danger { border-color: rgba(239,68,68,0.3); color: #f87171; }
    .nav-btn.danger:hover { border-color: #ef4444; background: rgba(239,68,68,0.1); }

    .language-select {
      appearance: none;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      color: var(--c-text);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }

    .language-select:hover { border-color: var(--c-accent); }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 80px;
      flex: 1;
      width: 100%;
    }

    .hero {
      background: linear-gradient(135deg, var(--c-surface) 0%, var(--c-surface-2) 100%);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-lg);
      padding: 44px 48px;
      margin-bottom: 32px;
      color: var(--c-text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--c-accent-glow) 0%, transparent 70%);
      top: -100px;
      right: -50px;
      pointer-events: none;
    }

    .hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      position: relative;
      background: linear-gradient(135deg, #f0f0f5, #a0a0b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p { color: var(--c-muted); font-size: 15px; position: relative; }

    .filters {
      background: var(--c-surface);
      padding: 24px;
      border-radius: var(--radius);
      margin-bottom: 32px;
      border: 1px solid var(--c-border);
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.2px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    input, select {
      padding: 11px 14px;
      border: 1.5px solid var(--c-border);
      border-radius: var(--radius-sm);
      min-width: 180px;
      font-family: var(--font);
      font-size: 14px;
      color: var(--c-text);
      background: var(--c-surface-2);
      outline: none;
      transition: all 0.25s var(--ease);
    }

    input:focus, select:focus {
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px var(--c-accent-glow);
    }

    input::placeholder { color: #555570; }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .food-card {
      background: var(--c-surface);
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid var(--c-border);
      transition: all 0.3s var(--ease);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .food-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--c-accent), #3b82f6);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .food-card:hover {
      transform: translateY(-6px);
      border-color: rgba(34,197,94,0.3);
      box-shadow: 0 16px 48px rgba(0,0,0,0.3), 0 0 40px var(--c-accent-glow);
    }

    .food-card:hover::before { opacity: 1; }

    .food-card h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.2px;
    }

    .food-card p {
      margin-bottom: 8px;
      color: var(--c-muted);
      font-size: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .badge-discount { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .badge-free    { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-regular { background: rgba(136,136,160,0.15); color: #a0a0b8; }

    .food-card-footer { margin-top: auto; padding-top: 16px; }

    .request-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font);
      font-weight: 700;
      font-size: 14px;
      transition: all 0.25s var(--ease);
      letter-spacing: 0.2px;
    }

    .request-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--c-accent-glow); }
    .request-btn:disabled { background: var(--c-surface-2); color: var(--c-muted); cursor: not-allowed; transform: none; box-shadow: none; }

    .empty-text {
      color: var(--c-muted);
      font-size: 15px;
      text-align: center;
      padding: 64px 0;
      grid-column: 1 / -1;
    }
    

    footer {
      background: var(--c-surface);
      color: var(--c-muted);
      padding: 24px 20px;
      text-align: center;
      font-size: 13px;
      border-top: 1px solid var(--c-border);
    }
.logo-link {
  display: flex;
  align-items: center;
  gap: 10px;

}

    @media (max-width: 768px) {
      header { padding: 14px 20px; height: auto; flex-wrap: wrap; gap: 12px; }
      .nav-right { flex-wrap: wrap; justify-content: center; width: 100%; gap: 6px; }
      .hero { flex-direction: column; align-items: flex-start; padding: 32px 24px; }
      .hero h1 { font-size: 1.5rem; }
      .filter-row { flex-direction: column; }
      input, select { width: 100%; min-width: unset; }
    }
  </style>
</head>

<body>
  <header>
    <!-- <a href="#">&#127807; FoodSaver</a> -->
     <a href="#" class="logo-link">
  <img src="logo.svg" alt="FoodSaver Logo" class="logo-img">
  <span>FoodSaver</span>
</a>

    <div class="nav-right">
      <!-- Notification Bell -->
       <a href="#" id="notificationBell" class="nav-link">
        <span data-i18n="alerts">Alerts</span>
        <span id="notifCount" style="color:#e74c3c; font-weight:bold; display:none;">(0)</span>
      </a>

      <button class="nav-btn" onclick="window.location.href='request.html'" data-i18n="myRequests">
        My Requests
      </button>

   <select id="languageSelector" class="language-select">
      <option value="en">English</option>
        <option value="tr">Türkçe</option>
   </select>

      <button class="nav-btn" onclick="goToProfile()" data-i18n="profile">
        Profile
      </button>
<button class="nav-btn danger" id="logoutBtn" data-i18n="logout">
        Logout
      </button>
    </div>
  </header>

  <main class="page">
    <section class="hero">
  <div>
    <h1 data-i18n="welcomeCustomer">Welcome, Customer</h1>
    <p data-i18n="customerHeroText">
      Browse available food from restaurants, filter items, and request one portion quickly.
    </p>
  </div>
</section>

    <section class="filters">
      <h2 class="section-title" data-i18n="browseFood">Browse Food</h2>

      <div class="filter-row">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search food or restaurant" 
          data-i18n-placeholder="searchFood"
        />

        <select id="typeFilter">
          <option value="all" data-i18n="allTypes">All Types</option>
          <option value="discount" data-i18n="discount">Discount</option>
          <option value="free" data-i18n="freeFood">Free Food</option>
          <option value="meal" data-i18n="meal">Meal</option>
          <option value="bakery" data-i18n="bakery">Bakery</option>
          <option value="beverage" data-i18n="beverage">Beverage</option>
        </select>

        <select id="categoryFilter">
          <option value="all" data-i18n="allCategories">All Categories</option>
          <option value="Meal" data-i18n="meal">Meal</option>
          <option value="Bakery" data-i18n="bakery">Bakery</option>
          <option value="Beverage" data-i18n="beverage">Beverage</option>
        </select>
      </div>
    </section>

    <section>
      <div class="food-grid" id="foodGrid">
        <!-- Food items will be dynamically injected here by customer.js -->
      </div>
    </section>
  </main>

  <footer>
    &copy; 2026 FoodSaver. All rights reserved.
  </footer>
</body>
